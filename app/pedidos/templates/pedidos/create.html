{% extends "base.html" %} {% block title %}Registrar Nuevo Pedido{% endblock %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div
      class="card shadow-lg border-0 rounded-4"
      style="background-color: #1e1e1e; color: #f8f9fa"
    >
      <div class="card-body p-5">
        <h4
          class="mb-4 text-center fw-light border-bottom border-secondary pb-3"
        >
          Nuevo Pedido
        </h4>

        <form action="{{ url_for('bp_pedidos.create') }}" method="POST">
          <!-- Fecha -->
          <div class="mb-4">
            <label
              for="fecha"
              class="form-label text-secondary small text-uppercase"
              style="letter-spacing: 1px"
            >
              Fecha
            </label>

            <input
              type="date"
              id="fecha"
              name="fecha"
              class="form-control bg-dark text-light border-secondary shadow-none"
              required
            />
          </div>

          <!-- Monto -->
          <div class="mb-4">
            <label
              for="monto"
              class="form-label text-secondary small text-uppercase"
              style="letter-spacing: 1px"
            >
              Monto
            </label>

            <input
              type="number"
              step="0.01"
              id="monto"
              name="monto"
              class="form-control bg-dark text-light border-secondary shadow-none"
              placeholder="Ej. 150.50"
              required
            />
          </div>

          <!-- Cliente -->
          <div class="mb-4">
            <label
              for="cliente_id"
              class="form-label text-secondary small text-uppercase"
              style="letter-spacing: 1px"
            >
              Cliente
            </label>

            <select
              id="cliente_id"
              name="cliente_id"
              class="form-select bg-dark text-light border-secondary shadow-none"
              required
            >
              <option value="">Seleccione un cliente</option>

              {% for cliente in clientes %}

              <option value="{{ cliente.id }}">{{ cliente.nombre }}</option>

              {% endfor %}
            </select>
          </div>

          <!-- Producto -->
          <div class="mb-5">
            <label
              for="producto_id"
              class="form-label text-secondary small text-uppercase"
              style="letter-spacing: 1px"
            >
              Producto
            </label>

            <select
              id="producto_id"
              name="producto_id"
              class="form-select bg-dark text-light border-secondary shadow-none"
              required
            >
              <option value="">Seleccione un producto</option>

              {% for producto in productos %}

              <option value="{{ producto.id }}">{{ producto.nombre }}</option>

              {% endfor %}
            </select>
          </div>

          <div class="d-grid gap-3">
            <button
              type="submit"
              class="btn btn-primary rounded-pill py-2 border-0"
              style="background-color: #4f46e5"
            >
              Guardar Pedido
            </button>

            <a
              href="{{ url_for('bp_pedidos.index') }}"
              class="btn btn-outline-light rounded-pill py-2"
            >
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
