{% extends "base.html" %} {% block title %}Editar Pedido{% endblock %} {% block
content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-4">Editar Pedido</h3>

        <form
          action="{{ url_for('bp_pedidos.edit', id=pedido.id) }}"
          method="POST"
        >
          <!-- Fecha -->
          <div class="mb-3">
            <label class="form-label"> Fecha </label>

            <input
              type="date"
              name="fecha"
              value="{{ pedido.fecha }}"
              class="form-control"
              required
            />
          </div>

          <!-- Monto -->
          <div class="mb-3">
            <label class="form-label"> Monto </label>

            <input
              type="number"
              step="0.01"
              name="monto"
              value="{{ pedido.monto }}"
              class="form-control"
              placeholder="150.50"
              required
            />
          </div>

          <!-- Cliente -->
          <div class="mb-3">
            <label class="form-label"> Cliente </label>

            <select name="cliente_id" class="form-select" required>
              {% for cliente in clientes %}

              <option
                value="{{ cliente.id }}"
                {%
                if
                cliente.id=""
                ="pedido.cliente_id"
                %}selected{%
                endif
                %}
              >
                {{ cliente.nombre }}
              </option>

              {% endfor %}
            </select>
          </div>

          <!-- Producto -->
          <div class="mb-4">
            <label class="form-label"> Producto </label>

            <select name="producto_id" class="form-select" required>
              {% for producto in productos %}

              <option value="{{ producto.id }}" {% if producto.id=" " ="pedido.producto_id"%}selected{%endif%}>
                {{ producto.nombre }}
              </option>

              {% endfor %}
            </select>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Actualizar</button>

            <a
              href="{{ url_for('bp_pedidos.index') }}"
              class="btn btn-secondary"
            >
              Volver
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
