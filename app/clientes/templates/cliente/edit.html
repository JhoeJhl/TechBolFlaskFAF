{% extends "base.html" %} {% block title %}Editar Miembro{% endblock %} {% block
content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-4">Editar Miembro</h3>

        <form
          action="{{ url_for('bp_clientes.edit', id=cliente.id) }}"
          method="POST"
        >
          <div class="mb-3">
            <label class="form-label"> Nombre </label>

            <input
              type="text"
              name="nombre"
              value="{{ cliente.nombre }}"
              class="form-control"
              placeholder="Nombre Completo"
              required
            />
          </div>

          <div class="mb-4">
            <label class="form-label"> Telefono </label>

            <input
              type="text"
              name="telefono"
              value="{{ cliente.telefono }}"
              class="form-control"
              placeholder="77757733"
              required
            />
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Actualizar</button>

            <a
              href="{{ url_for('bp_clientes.index') }}"
              class="btn btn-secondary"
            >
              Volver
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
