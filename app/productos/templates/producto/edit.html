{% extends "base.html" %} {% block title %}Editar Producto{% endblock %} {%
block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-4">Editar Producto</h3>

        <form
          action="{{ url_for('bp_productos.edit', id=producto.id) }}"
          method="POST"
        >
          <!-- Nombre -->
          <div class="mb-3">
            <label class="form-label"> Nombre </label>

            <input
              type="text"
              name="nombre"
              value="{{ producto.nombre }}"
              class="form-control"
              placeholder="Nombre del producto"
              required
            />
          </div>

          <!-- Precio -->
          <div class="mb-3">
            <label class="form-label"> Precio </label>

            <input
              type="number"
              step="0.01"
              name="precio"
              value="{{ producto.precio }}"
              class="form-control"
              placeholder="3500"
              required
            />
          </div>

          <!-- Stock -->
          <div class="mb-4">
            <label class="form-label"> Stock </label>

            <input
              type="number"
              name="stock"
              value="{{ producto.stock }}"
              class="form-control"
              placeholder="20"
              required
            />
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Actualizar</button>

            <a
              href="{{ url_for('bp_productos.index') }}"
              class="btn btn-secondary"
            >
              Volver
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
